  if (runRec && state === 'finish' && (mode === 'stunt' || stateT > 4)) runRec.closed = true;   // a stunt run ends at the line; a race keeps rolling a few seconds
  if (state === 'replay') tickReplay(dt);
  if (tut) tutTick(dt);
  // the camera rises with the rider (or the editing cursor) instead of letting them leave the top of the screen
  let fy = null;
  if (state === 'play' || state === 'count' || state === 'intro' || state === 'finish') fy = laneYNow() - bike.hv * SC;
  else if (state === 'crash' && bike.crash) fy = laneYNow() - Math.max(terrain(bike.lane, camX), bike.crash.bodies[0].h) * SC;   // up and down with the bike, like left and right

  else if (state === 'replay') fy = laneYNow() - (bike.crash ? Math.max(terrain(bike.lane, camX), bike.crash.bodies[0].h) : bike.hv) * SC;

  fx.shake = Math.max(0, fx.shake - 20 * dt);
  for (let i = fx.popups.length - 1; i >= 0; i--) { const p = fx.popups[i]; p.t += dt; if (p.t > p.life) fx.popups.splice(i, 1); }
  for (let i = fx.parts.length - 1; i >= 0; i--) {
    const p = fx.parts[i]; p.t += dt; p.x += p.vx * dt; p.h += p.vy * dt; p.vy -= 200 * dt; if (p.h < 0) { p.h = 0; p.vy = 0; }
    if (p.t > p.life) fx.parts.splice(i, 1);
  }
}

// trackside barrier (y 49..55)
function drawBarrier(cx) {
  const co2 = cx * SC, bg = trk.bg;
  if (bg === 'city') {
    for (let k = Math.floor((co2 - BIKE_SX) / 16); k <= Math.floor((co2 - BIKE_SX + W) / 16); k++) {
      const sx = Math.round(BIKE_SX + k * 16 - co2);
      rect(sx, 49, 16, 6, '#bcbcbc'); rect(sx, 49, 16, 1, '#d8d8d8'); rect(sx, 54, 16, 1, '#747474'); rect(sx + 15, 49, 1, 6, '#747474');
      rect(sx + 4, 51, 8, 2, (k & 1) ? P.flag : P.white);
    }
    if (!(ATT.on && ATT.titleBg)) for (let k = Math.floor((co2 - BIKE_SX - 20) / 120); k <= Math.floor((co2 - BIKE_SX + W) / 120); k++) {   // Kenney's streetlights along the kerb, arm out over the road
      const sx = Math.round(BIKE_SX + k * 120 - co2), top = 55 - LIGHT_SPR.length * 2;
      LIGHT_SPR.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === 'p') rect(sx + x * 2, top + y * 2, 2, 2, '#c8e0ff'); });
      emit(sx + 10, top, 4, 4, '#fcfcd8');                       // the lamp (stays lit at night)
      if (lit()) glows.push([sx + 12, top + 4]);
    }
    return;
  }
  if (bg === 'desert') {
    for (let k = Math.floor((co2 - BIKE_SX) / 8); k <= Math.floor((co2 - BIKE_SX + W) / 8); k++) {
      const sx = Math.round(BIKE_SX + k * 8 - co2);
      rect(sx, 49, 7, 3, '#2c2c2c'); rect(sx, 52, 7, 3, '#2c2c2c'); rect(sx + 2, 50, 3, 1, '#747474'); rect(sx + 2, 53, 3, 1, '#747474');
    }
    return;
  }
  if (bg === 'arctic') {
    for (let x = 0; x < W; x++) { const u = x + co2, h = 3 + Math.round(2 * Math.sin(u / 6) + Math.sin(u / 2.3)); rect(x, 55 - h, 1, h, (Math.floor(u / 6) & 1) ? '#fcfcfc' : '#d8f8fc'); rect(x, 54, 1, 1, '#a4e4fc'); }
    return;
  }
  for (let k = Math.floor((co2 - BIKE_SX) / 13); k <= Math.floor((co2 - BIKE_SX + W) / 13); k++) {   // hay bales
    const sx = Math.round(BIKE_SX + k * 13 - co2);
    rect(sx, 49, 12, 6, (k & 1) ? P.hay : P.hayD); rect(sx + 2, 51, 8, 1, P.hayL); rect(sx + 2, 53, 8, 1, P.hayL);
  }
}

for (const k in BG_PIECES.skyline) for (const i in BG_PIECES.skyline[k]) { const c = BG_PIECES.skyline[k][i]; c.I = c.pieces.map(u => ({ im: loadImg(u), y: 0 })); }

    drawBikeSprite(by, b.angle, 0, b.rdm && rdmStage(b.rdm.p) ? rdmBody(rdmNum(b)) : b.turbo > 0 ? 2 : 0, b.rdm && rdmStage(b.rdm.p) ? 5 : 0, Math.floor(b.spin / 4.4) & 1, Math.floor(b.spin / 2.2) & 1);
    ctx.restore(); for (let k = n; k < lamps.length; k++) lamps[k][0] += dx; for (let k = nf; k < fires.length; k++) fires[k][0] += dx;
    return;
  }
  const gy = ly - Math.round(terrain(b.lane, b.x) * SC), by = ly - Math.round(b.hv * SC);
  const air = clamp((gy - by) / 24, 0, 1), sw = Math.round(20 - air * 10);
  rect(BIKE_SX - (sw >> 1), gy, sw, 2, P.dirtDD);                             // shadow shrinks as you climb
  let body = 0, mode = 0, bob = 0;
  if (b.grounded) {
    const r = b.rel;
    if (b.landT > 0) mode = 3;
    if (r > 0.42 || (inp.back && r > 0.25)) body = -2; else if (r > 0.1 || (b.lean < -0.5 && r > 0)) body = -1;
    else if (r < -0.25) body = 2; else if (r < -0.07 || b.lean > 0.5) body = 1;
    if (b.turbo > 0 && body >= 0) body = 2;                                   // duck down behind the bars when the turbo kicks
    if (b.v > 60) bob = Math.floor(b.spin / (b.wasMud ? 2.2 : 4.4)) & 1;
  } else {
    mode = b.vy > 0 ? 1 : 2; body = inp.back ? -1 : inp.fwd ? 1 : 0;
    if (b.turbo > 0 && !inp.back && !inp.fwd) body = 1;
    if (b.trick === 'superman' && b.trickP > 0) { mode = 4; body = Math.max(1, Math.ceil(b.trickP * 3 - 0.01)); }
    if (b.trick === 'invert' && b.trickP > 0) { drawInvert(by, b.angle, b.trickP, Math.floor(b.spin / 2.2) & 1); return; }
  }
  if (b.rdm && rdmStage(b.rdm.p)) { mode = 5; body = rdmBody(rdmNum(b)); }   // REDEEMER (or on the way up or down)
  const look = state === 'replay' ? b.mvRec : moveLook(b);              // HEADSTAND / SUPER MARIO
  if (look) { mode = look[0]; body = look[1]; }
  // exhaust flame while a boost is coming in: small for a wheelie boost, bigger with every stacked trick/turbo boost
  const live = state === 'play' || state === 'replay';
  const wheelieBoost = live && b.grounded && b.manualT > 0 && b.rel > 0.15 && b.wBoost < 130;
  const flame = (wheelieBoost ? 0.6 : 0) + (live ? (b.tb || 0) / 140 : 0);
  if (flame > 0.05) drawFlame(by, b.angle, b.pivotT, Math.min(flame, 3.5));
  // danger zone (the tilt gauge's yellow-to-red, just short of going over backwards): the front wheel shimmies and a hand flails
  const dz = (state === 'play' || state === 'replay') && b.grounded && !b.loop && b.rel > 0 && b.rel > (b.thr || 0.66) * 0.8 ? 1 + (Math.floor(tNow * 12) & 1) : 0;
  drawProf();
  drawBikeSprite(by, b.angle, b.pivotT, body, mode, bob, Math.floor(b.spin / 2.2) & 1, undefined, 0, dz, (look && look[0] === 7) || (tut && tut.stage === 'intro'));
  if (look && look[0] === 7) drawMarioJump(BIKE_SX, by, look, 0);
  if (b.hado) drawHado(BIKE_SX, by, b.angle, b.hado.t);
}

function drawRival(o) {

    if (bsx < -50 || bsx > W + 50) return;

    rect(Math.round(bsx) - 6, gB, 12, 1, P.dirtDD);
    if (c.ts === undefined) {
      drawUnsunk('bc' + th, bikeBase(0, 0, 0, 0, false, th), q0.rot, q0.x, ly - q0.h * SC, ly, o.lane);
      drawUnsunk('rag' + th, footBase('rag', th), q1.rot, q1.x, ly - q1.h * SC - 15 + 3 * Math.abs(Math.sin(q1.rot)), ly, o.lane);
      return;
    }

    const slope = slopeAt(o.lane, q0.x), u = clamp((ct - 0.8) / 0.5, 0, 1), e = 1 - (1 - u) * (1 - u);

    drawUnsunk('bc' + th, bikeBase(0, 0, 0, 0, false, th), rot, q0.x, gB, ly, o.lane);
    const rx = q0.x - 13, hop = ct > 1.3 ? Math.sin(clamp((ct - 1.3) / 0.3, 0, 1) * Math.PI) * 8 : 0;
    drawRunner(wsx(rx, camX), ly - Math.round(terrain(o.lane, rx) * SC) - hop, ct < 0.3 ? 'sit' : ct < 0.8 ? 'stand' : ct < 1.3 ? 'lift' : 'jump', 1, th);
    return;
  }
  const sx = wsx(o.x, camX) + (o.loop ? o.loopDX * SC : 0); if (sx < -50 || sx > W + 50) return;
  if (o.loop) { drawBikeSprite(ly - Math.round(o.hv * SC), o.angle, 0, 0, 0, Math.floor(o.spin / 4.4) & 1, Math.floor(o.spin / 2.2) & 1, Math.round(sx), th); return; }
  const gy = ly - Math.round(terrain(o.lane, o.x) * SC), by = ly - Math.round(o.hv * SC);

// checkered line across every lane, with a banner over the track
// lane = which lane's strip of the line to draw; lane < 0 draws just the banner over the finish
function drawLine(wx, cx, finish, lane) {
  if (lane >= 0 && mode === 'stunt' && stuntTrack.length && !stuntOnTrack(lane, wx)) return;   // stunt track: only across its two lanes
  const sx = Math.round(wsx(wx, cx));
  if (sx < -30 || sx > W + 30) return;
  const lift = Math.round((lane >= 0 ? laneBase(lane, wx) : baseAt(wx)) * SC);
  if (lift) { ctx.save(); ctx.translate(0, -lift); drawLine0(sx, finish, lane); ctx.restore(); } else drawLine0(sx, finish, lane);
}
function drawLine0(sx, finish, lane) {
  if (lane >= 0) {
    const y0 = LANE_SY[lane] - 15;
    for (let r = 0; r < 6; r++) for (let k = 0; k < 2; k++)
      rect(sx + k * 3, y0 + r * 3, 3, 3, finish ? (((r + k) & 1) ? P.black : P.white) : P.white);
    return;
  }
  if (!finish) return;
  rect(sx - 22, 36, 1, 19, P.gray); rect(sx + 27, 36, 1, 19, P.gray);
  rect(sx - 22, 33, 50, 10, P.black); rect(sx - 21, 34, 48, 8, P.flag);
  text('FINISH', sx + 3, 35, P.white, 1, 'center');
}

function drawParts(cx) {
  for (const p of fx.parts) {
    if (p.t > p.life * 0.75 && (Math.floor(p.t * 30) & 1)) continue;          // blink out instead of fading
    const s = p.s > 2 ? 2 : 1;
    rect(Math.round(wsx(p.x, cx)), p.ly - Math.round(p.h * SC), s, s, p.c);
  }
}

function drawPopups() {
  const by = laneYNow() - bike.hv * SC;
  for (const p of fx.popups) {
    if (p.t > p.life * 0.7 && (Math.floor(p.t * 20) & 1)) continue;
    text(p.text, BIKE_SX + 16, Math.round(by - 30 - p.slot * 9 - p.t * 8), p.color, 1);
  }
}

}
